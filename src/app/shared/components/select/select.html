<div class="flex flex-col gap-1.5 w-full relative">
  @if (label()) {
    <label class="body-2 text-gray-700 font-semibold">{{ label() }}</label>
  }

  <!-- Trigger -->
  <div 
    (click)="toggle()"
    class="flex items-center justify-between w-full h-11 px-4 py-2 rounded-lg border transition-all duration-200 cursor-pointer select-none bg-white group"
    [class.border-brand-primary]="isOpen()"
    [class.border-gray-300]="!isOpen() && !disabled()"
    [class.bg-gray-50]="disabled()"
    [class.cursor-not-allowed]="disabled()"
  >
    <span class="body-2 truncate" [class.text-gray-400]="!value() && !disabled()" [class.text-gray-700]="value() || disabled()">
      {{ getSelectedLabel() }}
    </span>
    
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      width="18" height="18" 
      viewBox="0 0 24 24" 
      fill="none" 
      stroke="currentColor" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      class="text-gray-400 transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    >
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </div>

  <!-- Dropdown Menu -->
  @if (isOpen()) {
    <div class="absolute top-[calc(100%+4px)] left-0 w-full bg-white border border-gray-100 rounded-xl shadow-xl z-[100] py-1 overflow-hidden animate-in fade-in zoom-in duration-200">
      @for (option of options(); track option.value) {
        <div 
          (click)="select(option)"
          class="flex items-center justify-between px-4 py-3 cursor-pointer transition-colors duration-150"
          [class.bg-gray-50]="value() === option.value"
          [class.hover:bg-gray-50]="value() !== option.value"
        >
          <span class="body-2" [class.text-brand-primary]="value() === option.value" [class.text-gray-700]="value() !== option.value">
            {{ option.label }}
          </span>
          
          @if (value() === option.value) {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-brand-red">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          }
        </div>
      } @empty {
        <div class="px-4 py-3 text-center body-3 text-gray-400">
          ไม่มีข้อมูล
        </div>
      }
    </div>
  }
</div>
