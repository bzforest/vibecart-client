<div class="flex flex-col gap-1.5 w-full">
  @if (label()) {
    <label class="body-2 text-gray-700 font-semibold">{{ label() }}</label>
  }

  <div class="relative flex items-center">
    <input
      [type]="type()"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      (input)="onInput($event)"
      class="w-full h-11 px-4 py-2 rounded-lg border transition-all duration-200 outline-none body-2"
      [class.border-gray-300]="!error() && !disabled()"
      [class.border-brand-red]="error()"
      [class.bg-gray-50]="disabled()"
      [class.text-gray-400]="disabled()"
      [class.focus:border-brand-primary]="!error() && !disabled()"
      [class.focus:ring-2]="!error() && !disabled()"
      [class.focus:ring-brand-primary/10]="!error() && !disabled()"
    />

    @if (value() && !disabled()) {
      <button 
        (click)="clear()"
        class="absolute right-3 p-1 rounded-full hover:bg-gray-100 transition-colors text-gray-400"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    }
  </div>

  @if (error() && error() !== true) {
    <p class="body-3 text-brand-red">{{ error() }}</p>
  } @else if (helpText()) {
    <p class="body-3 text-gray-400">{{ helpText() }}</p>
  }
</div>
