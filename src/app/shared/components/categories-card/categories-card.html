<div class="flex flex-col items-center justify-center w-[120px] h-[150px] bg-white border border-gray-100 hover:shadow-md hover:-translate-y-0.5 transition-all cursor-pointer p-2 relative group">

    <div class="relative w-[80px] h-[80px] flex items-center justify-center mb-2">
      
      <div class="absolute inset-0 m-auto w-[80px] h-[80px] bg-gray-300 rounded-full z-0 group-hover:bg-gray-400 transition-colors"></div>
  
      <img [src]="imageUrl" 
           [alt]="categoryName" 
           class="relative z-10 w-full h-full object-contain drop-shadow-sm group-hover:scale-110 transition-transform duration-300">
    </div>
  
    <h3 class="text-[12px] text-gray-700 text-center leading-tight line-clamp-2 px-1">
      {{ categoryName }}
    </h3>
  
  </div>
